<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战争巨兽数据面板</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131a26;
            --bg-input: #1c2635;
            --border-color: #26354a;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            
            /* 四段式进度条颜色 */
            --color-initial: #059669;    /* 第1段：初始底分 - 绿色 */
            --color-active: #007cf0;     /* 第2段：已代打部分 - 青蓝渐变底色 */
            --color-todo: #374151;       /* 第3段：剩余未完成 - 浅灰 */
            --color-unneeded: #1f2937;   /* 第4段：无需完成死区 - 深灰 */
            
            --accent-blue: #007cf0;
            --accent-gradient: linear-gradient(135deg, #007cf0 0%, #00dfd8 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100vh; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: var(--bg-main); color: var(--text-primary); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        #login-container { display: flex; justify-content: center; align-items: center; height: 100vh; background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 60%, #020617 100%); position: relative; }
        #login-container::before { content: ''; position: absolute; width: 300px; height: 300px; background: #007cf0; filter: blur(120px); opacity: 0.15; top: 20%; left: 20%; }
        .login-card { background: rgba(19, 26, 38, 0.8); backdrop-filter: blur(12px); padding: 40px; border-radius: 16px; border: 1px solid var(--border-color); width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); text-align: center; z-index: 10; }
        .login-card h2 { margin-bottom: 8px; font-size: 24px; letter-spacing: 1px; background: linear-gradient(to right, #fff, #9ca3af); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-card p { color: var(--text-secondary); font-size: 13px; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input { width: 100%; padding: 12px 16px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; color: #fff; transition: all 0.25s; }
        .input-group input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(0, 124, 240, 0.2); }
        .login-btn { width: 100%; padding: 14px; background: var(--accent-gradient); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; letter-spacing: 2px; box-shadow: 0 4px 12px rgba(0, 124, 240, 0.3); transition: all 0.2s; }
        .login-btn:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 124, 240, 0.4); }
        #login-error { color: #ef4444; font-size: 13px; margin-top: 15px; display: none; line-height: 1.5; padding: 10px; background: rgba(239, 68, 68, 0.1); border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.3); }

        #main-dashboard { display: none; height: 100vh; flex-direction: column; padding: 20px; gap: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 16px 28px; border-radius: 12px; border: 1px solid var(--border-color); }
        header h1 { font-size: 20px; font-weight: 600; background: linear-gradient(to right, #007cf0, #00dfd8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logout-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
        .logout-btn:hover { background: #ef4444; color: white; }
        .content-layout { display: flex; gap: 20px; flex: 1; overflow: hidden; }
        .panel-box { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); padding: 24px; display: flex; flex-direction: column; overflow: hidden; }
        .panel-box h3 { font-size: 16px; margin-bottom: 18px; color: #fff; display: flex; align-items: center; gap: 8px; border-left: 4px solid var(--accent-blue); padding-left: 10px; }
        
        .left-col { flex: 1.3; }
        .achievement-list { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; flex: 1; padding-right: 4px; }
        .achievement-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; transition: border-color 0.2s; }
        .achievement-card:hover { border-color: rgba(0, 124, 240, 0.5); }
        .ach-title-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; }
        .ach-name { font-weight: 600; color: #fff; }
        .ach-meta { color: var(--text-secondary); }

        /* 四段式进度条绝对稳固的外观容器 */
        .progress-container { position: relative; height: 18px; background-color: transparent; border-radius: 20px; overflow: hidden; display: flex; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        .progress-segment { height: 100%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        
        /* 颜色美化：按照您的要求更换成了更漂亮的渐变色体系 */
        .bg-initial { background: linear-gradient(90deg, #047857 0%, #10b981 100%); } 
        .bg-active { background: linear-gradient(90deg, #007cf0 0%, #00dfd8 100%); }  
        .bg-todo { background-color: var(--color-todo); }    
        .bg-unneeded { 
            background-color: var(--color-unneeded); 
            background-image: linear-gradient(45deg, #111827 25%, transparent 25%, transparent 50%, #111827 50%, #111827 75%, transparent 75%, transparent); 
            background-size: 16px 16px; 
        } 

        /* 仅仅修改百分比数字的定位：通过内嵌于 bg-active 内部使其完美在代打区域居中 */
        .progress-text-overlay { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            top: 0; left: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 11px; 
            color: #fff; 
            font-weight: 700; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.8); 
            pointer-events: none; 
            white-space: nowrap;
        }

        .mid-col { flex: 1.4; }
        .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .summary-card { background: linear-gradient(135deg, rgba(0,124,240,0.07) 0%, rgba(0,223,216,0.03) 100%); border: 1px solid rgba(0, 124, 240, 0.15); padding: 18px 12px; border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .summary-card span { font-size: 16px; font-weight: 700; color: #00dfd8; }
        
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
        .history-item { background: rgba(255,255,255,0.01); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; }
        .history-date { font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text-secondary); }
        .history-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .history-stat { font-size: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.03); padding: 6px 10px; border-radius: 6px; display: flex; justify-content: space-between; }

        .right-col { flex: 1.5; }
        .filter-controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        .select-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-input); color: #fff; font-size: 14px; outline: none; cursor: pointer; }
        .time-tabs { display: flex; gap: 6px; background: var(--bg-input); padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); }
        .tab-btn { flex: 1; border: none; background: transparent; padding: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; border-radius: 6px; transition: all 0.2s; }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { background: var(--accent-gradient); color: white; font-weight: 600; }
        
        .screenshot-display { flex: 1; overflow-y: auto; border: 1px dashed var(--border-color); border-radius: 8px; padding: 14px; background: rgba(0,0,0,0.1); }
        .img-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .img-wrapper { border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: var(--bg-main); aspect-ratio: 16/9; display: flex; flex-direction: column; transition: transform 0.2s; }
        .img-wrapper:hover { transform: scale(1.02); border-color: rgba(0,124,240,0.4); }
        .img-wrapper img { width: 100%; height: 80%; object-fit: cover; cursor: pointer; }
        .img-wrapper span { height: 20%; font-size: 11px; display: flex; justify-content: center; align-items: center; background: #172232; color: var(--text-secondary); border-top: 1px solid var(--border-color); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.9); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal img { max-width: 92%; max-height: 92%; border-radius: 8px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .modal-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; }

        @media (max-width: 992px) { .content-layout { flex-direction: column; overflow-y: auto; } html, body { overflow: auto; height: auto; } #main-dashboard { height: auto; overflow: visible; } .panel-box { max-height: 480px; } }
    </style>
</head>
<body>
    <div id="login-container">
        <div class="login-card">
            <h2>战争巨兽数据面板</h2>
            <p>请输入ID和PASSWORD</p>
            <div class="input-group"><label for="username">ID</label><input type="text" id="username" placeholder="请输入ID"></div>
            <div class="input-group"><label for="password">PASSWORD</label><input type="password" id="password" placeholder="请输入PASSWORD"></div>
            <button class="login-btn" onclick="handleLogin()">授权登录</button>
            <div id="login-error"></div>
        </div>
    </div>

    <div id="main-dashboard">
        <header>
            <h1 id="dashboard-title">战争巨兽完成进度 ID：</h1>
            <div>
                <span id="user-display" style="margin-right: 20px; font-size: 13px; color: var(--text-secondary); font-family: monospace;"></span>
                <button class="logout-btn" onclick="handleLogout()">退出登录</button>
            </div>
        </header>

        <div class="content-layout">
            <div class="panel-box left-col">
                <h3>🏆 进度</h3>
                <div class="achievement-list" id="achievement-list"></div>
            </div>

            <div class="panel-box mid-col">
                <h3>📈 今日新增</h3>
                <div class="summary-grid" id="summary-grid"></div>
                <div class="history-list" id="history-list"></div>
            </div>

            <div class="panel-box right-col">
                <h3>🖼️ 战绩截图</h3>
                <div class="filter-controls">
                    <div class="select-group"><select id="date-select" onchange="renderScreenshots()"></select></div>
                    <div class="time-tabs">
                        <button class="tab-btn active" onclick="switchTimePeriod('a', this)">🌅 上午</button>
                        <button class="tab-btn" onclick="switchTimePeriod('b', this)">☀️ 下午</button>
                        <button class="tab-btn" onclick="switchTimePeriod('c', this)">🌙 晚上(半夜)</button>
                    </div>
                </div>
                <div class="screenshot-display" id="screenshot-display"><div class="img-grid" id="img-grid"></div></div>
            </div>
        </div>
    </div>

    <div id="imgModal" class="modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img id="modalImg" src="">
    </div>

    <script>
        let usersConfig = {};
        
        // 解析 4 行配置
        function loadConfig() {
            fetch('id.txt?t=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) throw new Error("HTTP Error " + response.status);
                    return response.text();
                })
                .then(text => {
                    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                    usersConfig = {};
                    for (let i = 0; i < lines.length; i += 4) {
                        if (lines[i] && lines[i+1] && lines[i+2] && lines[i+3]) {
                            usersConfig[lines[i+1]] = { password: lines[i+2], folder: lines[i], name: lines[i+3] };
                        }
                    }
                })
                .catch(err => { 
                    console.error("未能加载 id.txt", err); 
                    const errDiv = document.getElementById("login-error");
                    errDiv.innerHTML = "⚠️ <strong>读取配置失败</strong><br>请确保运行了本地服务器环境！";
                    errDiv.style.display = "block";
                });
        }

        loadConfig();

        let currentFolder = ""; let currentPeriod = "a";
        let achievements = ["绝对主坦", "空中霸主", "战场飞车", "禁飞区"];

        function handleLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const errorDiv = document.getElementById("login-error");

            fetch('id.txt?t=' + new Date().getTime())
                .then(response => response.text())
                .then(text => {
                    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                    usersConfig = {};
                    for (let i = 0; i < lines.length; i += 4) {
                        if (lines[i] && lines[i+1] && lines[i+2] && lines[i+3]) {
                            usersConfig[lines[i+1]] = { password: lines[i+2], folder: lines[i], name: lines[i+3] };
                        }
                    }

                    if (usersConfig[user] && usersConfig[user].password === pass) {
                        errorDiv.style.display = "none";
                        currentFolder = usersConfig[user].folder;
                        
                        document.getElementById("dashboard-title").innerText = `战争巨兽完成进度 ID：${usersConfig[user].name}`;
                        document.getElementById("user-display").innerText = `当前ID：${user}`;

                        document.getElementById("login-container").style.display = "none";
                        document.getElementById("main-dashboard").style.display = "flex";
                        loadUserData();
                    } else {
                        errorDiv.innerHTML = "✕ 密钥验证失败，请检查账号和密码是否正确。";
                        errorDiv.style.display = "block";
                    }
                });
        }

        function handleLogout() {
            document.getElementById("login-container").style.display = "flex";
            document.getElementById("main-dashboard").style.display = "none";
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }

        // 绝不乱跑！这里被牢牢绑定在了登录用户所映射的独立数据路径下
        function loadUserData() {
            fetch(`${currentFolder}/records.txt?t=` + new Date().getTime())
                .then(response => { if (!response.ok) throw new Error("404"); return response.text(); })
                .then(text => parseRecords(text))
                .catch(err => alert(`无法加载该用户目录（${currentFolder}）下的 records.txt 文件。`));
        }

        function parseRecords(text) {
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            let initialData = [0,0,0,0]; let targetData = [100,100,100,100]; let historyRecords = [];
            for (let i = 0; i < lines.length; i += 2) {
                if (i + 1 >= lines.length) break;
                const date = lines[i]; const vals = lines[i+1].split('/').map(Number);
                if (date === "0.0") {
                    initialData = vals;
                } else if (date === "1.0") {
                    targetData = vals;
                } else {
                    if (vals.every(v => v === 0)) continue; // 剔除 0/0/0/0 无数据天
                    historyRecords.push({ date, values: vals });
                }
            }
            renderDashboard(initialData, targetData, historyRecords);
        }

        function renderDashboard(initial, target, history) {
            let latestValues = [...initial]; let lastActiveIndex = -1;
            for (let i = history.length - 1; i >= 0; i--) {
                if (history[i].values.some(v => v > 0)) { latestValues = history[i].values; lastActiveIndex = i; break; }
            }

            const achListDiv = document.getElementById("achievement-list"); achListDiv.innerHTML = "";
            achievements.forEach((name, idx) => {
                const initVal = initial[idx]; 
                const currentVal = latestValues[idx]; 
                const targetVal = target[idx]; 
                const maxCap = 100; 

                // 核心稳固：四段式底层逻辑切分一字不改
                const p1 = (initVal / maxCap) * 100;
                const p2 = (Math.max(0, currentVal - initVal) / maxCap) * 100;
                const p3 = (Math.max(0, targetVal - currentVal) / maxCap) * 100;
                const p4 = (Math.max(0, maxCap - targetVal) / maxCap) * 100;
                
                const progressRate = targetVal - initVal === 0 ? 100 : Math.round(((currentVal - initVal) / (targetVal - initVal)) * 100);

                // 仅仅修改结构：百分比数字现在内嵌在第二段 bg-active（代打增量段）中实现绝对居中
                achListDiv.innerHTML += `
                    <div class="achievement-card">
                        <div class="ach-title-row">
                            <span class="ach-name">${name}</span>
                            <span class="ach-meta">总进度: ${currentVal}/100</span>
                        </div>
                        <div class="progress-container">
                            <div class="progress-segment bg-initial" style="width: ${p1}%;"></div>
                            <div class="progress-segment bg-active" style="width: ${p2}%;">
                                <div class="progress-text-overlay">${progressRate}%</div>
                            </div>
                            <div class="progress-segment bg-todo" style="width: ${p3}%;"></div>
                            <div class="progress-segment bg-unneeded" style="width: ${p4}%;"></div>
                        </div>
                    </div>`;
            });

            // 获取今天东八区真实月日格式
            const options = { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric' };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            const [{ value: month }, , { value: day }] = formatter.formatToParts(new Date());
            const currentFormattedDate = `${month}.${day}`;

            let todayChanges = [0,0,0,0];
            if (lastActiveIndex >= 0) {
                const prevActive = lastActiveIndex > 0 ? history[lastActiveIndex - 1].values : initial;
                todayChanges = history[lastActiveIndex].values.map((v, i) => v - prevActive[i]);
            }
            
            const exactTodayIndex = history.findIndex(h => h.date === currentFormattedDate);
            if (exactTodayIndex >= 0) {
                const prevVals = exactTodayIndex > 0 ? history[exactTodayIndex - 1].values : initial;
                todayChanges = history[exactTodayIndex].values.map((v, i) => v - prevVals[i]);
            }

            const summaryDiv = document.getElementById("summary-grid"); summaryDiv.innerHTML = "";
            achievements.forEach((name, idx) => {
                const change = todayChanges[idx];
                const changeText = change >= 0 ? `+${change}` : change;
                summaryDiv.innerHTML += `
                    <div class="summary-card">
                        <span>${name} ${changeText}</span>
                    </div>`;
            });

            const historyDiv = document.getElementById("history-list"); historyDiv.innerHTML = "";
            for (let i = history.length - 1; i >= 0; i--) {
                const item = history[i]; const prevVals = i > 0 ? history[i-1].values : initial; let gridHtml = "";
                achievements.forEach((name, idx) => {
                    const diff = item.values[idx] - prevVals[idx];
                    gridHtml += `<div class="history-stat"><span style="color:var(--text-secondary)">${name}</span><span><strong>${item.values[idx]}</strong> <span style="margin-left:4px; font-weight:bold; color:${diff >= 0 ? '#00dfd8':'#ef4444'}">${diff >= 0 ? '+' + diff : diff}</span></span></div>`;
                });
                historyDiv.innerHTML += `<div class="history-item"><div class="history-date">📅 TIMELINE: 2026.${item.date}</div><div class="history-grid">${gridHtml}</div></div>`;
            }

            const dateSelect = document.getElementById("date-select"); dateSelect.innerHTML = "";
            let dateSet = new Set(history.map(h => h.date));
            dateSet.add(currentFormattedDate);
            const sortedDates = Array.from(dateSet).sort((a,b) => parseFloat(a) - parseFloat(b));

            sortedDates.forEach(dStr => {
                dateSelect.innerHTML += `<option value="${dStr}">2026.${dStr} 战绩截图</option>`;
            });
            dateSelect.value = currentFormattedDate;
            renderScreenshots();
        }

        function switchTimePeriod(period, btn) {
            currentPeriod = period; document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active"); renderScreenshots();
        }

        function renderScreenshots() {
            const dateStr = document.getElementById("date-select").value; const grid = document.getElementById("img-grid"); grid.innerHTML = "";
            if (!dateStr) return;

            let htmlStr = "";
            for (let i = 1; i <= 10; i++) {
                const imgName = `2026.${dateStr}.${currentPeriod}.${i}.jpg`; 
                const imgSrc = `${currentFolder}/screenshot/${imgName}`; 
                const wrapperId = `wrap-${currentPeriod}-${i}`;
                htmlStr += `<div class="img-wrapper" id="${wrapperId}" style="display:none;"><img src="${imgSrc}" id="img-${currentPeriod}-${i}" onclick="openModal('${imgSrc}')"><span>截图 // ${i}</span></div>`;
            }
            grid.innerHTML = htmlStr;

            for (let i = 1; i <= 10; i++) {
                const imgEl = document.getElementById(`img-${currentPeriod}-${i}`); 
                const wrapEl = document.getElementById(`wrap-${currentPeriod}-${i}`);
                if (imgEl && wrapEl) {
                    imgEl.onload = function() { wrapEl.style.display = "flex"; };
                    imgEl.onerror = function() { wrapEl.remove(); checkEmptyState(); };
                }
            }

            function checkEmptyState() {
                if (grid.children.length === 0) {
                    if (!document.getElementById('empty-tip')) { grid.innerHTML = "<div id='empty-tip' style='color:var(--text-secondary);font-size:13px;grid-column:span 2;text-align:center;padding:30px;border:1px dashed #26354a;border-radius:8px;background:rgba(0,0,0,0.2);'>⚠️ 当前时段未上号代打</div>"; }
                }
            }
            setTimeout(checkEmptyState, 300);
        }

        function openModal(src) { document.getElementById('imgModal').style.display = 'flex'; document.getElementById('modalImg').src = src; }
        function closeModal() { document.getElementById('imgModal').style.display = 'none'; }
    </script>
</body>
</html>
